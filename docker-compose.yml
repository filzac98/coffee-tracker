services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - coffee-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/dashboard/stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coffee-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:3000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coffee-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Runs the backend unit tests. Not started by "up" because of the profile.
  # Run: docker compose run --rm backend-test
  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    networks:
      - coffee-net

networks:
  coffee-net:
    name: coffee-net

volumes:
  db-data:
    name: coffee-db-data
